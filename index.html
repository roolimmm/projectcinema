
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Silver Village Cinemas</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <a href="index.html" class="logo">
            <h1>SILVER VILLAGE</h1>
            <span>CINEMAS</span>
        </a>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="#movies">Movies</a>
            <a href="bookings.html">My Bookings</a>
        </nav>

    </header>

    <main>

        <!-- PROMOTIONAL BANNER -->
        <section class="hero-banner">

            <div class="hero-content">

                <p class="hero-label">
                    SILVER VILLAGE PRESENTS
                </p>

                <h2>The Big Screen Experience</h2>

                <p>
                    Discover stories worth watching.
                </p>

                <a href="#movies" class="hero-btn">
                    Explore Movies
                </a>

            </div>

        </section>

        <!-- MOVIE CATALOGUE -->
        <section id="movies" class="movie-section">

            <div class="movie-heading">

                <button
                    id="category-title"
                    class="category-title"
                    type="button"
                    aria-label="Switch movie category">
                    Now Showing
                </button>

                <span id="category-counter">
                    01 / 02
                </span>

            </div>

            <!-- DRAGGABLE UNDERLINE -->
            <div class="category-slider">

                <input
                    type="range"
                    id="category-range"
                    min="0"
                    max="100"
                    step="1"
                    value="0"
                    aria-label="Movie category"
                    aria-valuetext="Now Showing"
                >

            </div>

            <!-- MOVIE CAROUSEL -->
            <div class="carousel-container">

                <button
                    class="carousel-prev"
                    type="button"
                    aria-label="Previous movies">
                    &#10094;
                </button>

                <div
                    id="movie-carousel"
                    class="movie-carousel"
                    aria-label="Movie catalogue"
                    aria-live="polite">

                    <!-- Generated by JavaScript -->

                </div>

                <button
                    class="carousel-next"
                    type="button"
                    aria-label="Next movies">
                    &#10095;
                </button>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">

        <p>
            &copy; 2026 Silver Village Cinemas.
            All Rights Reserved.
        </p>

    </footer>

</body>
</html>
